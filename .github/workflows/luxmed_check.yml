name: LuxMed Slot Checker

on:
  schedule:
    # Run once every 10 minutes, offset from the top of the hour
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

jobs:
  check_slots:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        echo "Installing base requirements..."
        pip install -r requirements.txt
        echo "Installing telegram dependency..."
        pip install telegram-send

    - name: Create Configuration File
      run: |
        cat <<EOF > telegram-send.conf
        [telegram]
        token = ${{ secrets.TELEGRAM_TOKEN }}
        chat_id = ${{ secrets.TELEGRAM_CHAT_ID }}
        EOF

        cat <<EOF > config.yml
        luxmed:
          login: "${{ secrets.LUXMED_LOGIN }}"
          password: "${{ secrets.LUXMED_PASSWORD }}"
        luxmedsniper:
          notification_provider:
            - "telegram"
          doctor_locators:
            - id: "${{ secrets.DOCTOR_ID }}"
              name: "Target Doctor Search"
              enabled: True
          lookup_time_days: 2
        telegram:
          tele_conf_path: "./telegram-send.conf"
          message_template: "New visit! {AppointmentDate} at {ClinicPublicName} - {DoctorName}"
        misc:
          notifydb: ./notifications.db
        EOF

    - name: Run one LuxMed check
      run: python3 -c 'from luxmed_sniper import LuxMedSniper; LuxMedSniper(["config.yml"]).check()'
