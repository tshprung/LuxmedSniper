name: Read-only LUX MED check

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Account profile
        required: true
        type: choice
        options:
          - PATIENT1
          - PATIENT2
          - PATIENT3

permissions:
  contents: read

jobs:
  check:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: luxmed-audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Check availability once
        shell: bash
        env:
          PROFILE: ${{ inputs.profile }}
          AUDIT_LOGIN: ${{ secrets[format('LUXMED_{0}_LOGIN', inputs.profile)] }}
          AUDIT_PASSWORD: ${{ secrets[format('LUXMED_{0}_PASSWORD', inputs.profile)] }}
          AUDIT_LOCATOR: ${{ secrets[format('LUXMED_{0}_LOCATOR', inputs.profile)] }}
        run: |
          case "$PROFILE" in
            PATIENT1|PATIENT2|PATIENT3) ;;
            *) echo "invalid-profile"; exit 2 ;;
          esac
          export "LUXMED_${PROFILE}_LOGIN=$AUDIT_LOGIN"
          export "LUXMED_${PROFILE}_PASSWORD=$AUDIT_PASSWORD"
          export "LUXMED_${PROFILE}_LOCATOR=$AUDIT_LOCATOR"
          unset AUDIT_LOGIN AUDIT_PASSWORD AUDIT_LOCATOR
          python audit_search.py "${PROFILE,,}" --status-only
