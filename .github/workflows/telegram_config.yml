name: Package Telegram configuration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: luxmed-audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r deploy/requirements.txt
      - name: Encrypt settings for the VM
        env:
          CONFIG_RECEIVER_PUBLIC_KEY: ${{ vars.LUXMED_TELEGRAM_RECEIVER_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LUXMED_BOOKING_CALENDAR: ${{ secrets.LUXMED_BOOKING_CALENDAR }}
          LUXMED_DIRECT_BOOKING: ${{ vars.LUXMED_DIRECT_BOOKING }}
          LUXMED_DIRECT_BOOKING_PATIENTS: ${{ vars.LUXMED_DIRECT_BOOKING_PATIENTS }}
          LUXMED_TELEGRAM_PROFILES: ${{ secrets.LUXMED_TELEGRAM_PROFILES }}
          LUXMED_PATIENT1_LOGIN: ${{ secrets.LUXMED_PATIENT1_LOGIN }}
          LUXMED_PATIENT1_PASSWORD: ${{ secrets.LUXMED_PATIENT1_PASSWORD }}
          LUXMED_PATIENT2_LOGIN: ${{ secrets.LUXMED_PATIENT2_LOGIN }}
          LUXMED_PATIENT2_PASSWORD: ${{ secrets.LUXMED_PATIENT2_PASSWORD }}
          LUXMED_PATIENT3_LOGIN: ${{ secrets.LUXMED_PATIENT3_LOGIN }}
          LUXMED_PATIENT3_PASSWORD: ${{ secrets.LUXMED_PATIENT3_PASSWORD }}
        run: python telegram_configuration.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: telegram-config-sealed
          path: telegram-config.sealed
          if-no-files-found: error
          retention-days: 1
